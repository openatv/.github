name: Ruff Linter (reusable)

on:
  workflow_call:
    inputs:
      path:
        description: "src folder"
        required: false
        type: string
        default: "src"
      python-version:
        required: false
        type: string
        default: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          cd ${{ inputs.path }}
          ruff check .
